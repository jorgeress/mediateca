name: Publicar mediateca

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Quartz saca las fechas de creacion y modificacion del historial.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --ignore-scripts evita que sharp intente compilarse desde fuente:
      # los binarios precompilados de @img ya vienen en las dependencias.
      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts --include=optional
          npm run install-plugins

      - name: Construir el sitio
        run: npx quartz build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
