name: Publicar mediateca

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Quartz saca las fechas de creacion y modificacion del historial.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --ignore-scripts evita que sharp intente compilarse desde fuente:
      # los binarios precompilados de @img ya vienen en las dependencias.
      - name: Instalar dependencias
        run: |
          npm ci --ignore-scripts --include=optional
          npm run install-plugins

      - name: Construir el sitio
        run: npx quartz build

      # GitHub Pages no esta disponible en repos privados con el plan
      # gratuito, asi que el despliegue se salta mientras el repo lo sea.
      # En cuanto pase a publico se activa solo, sin tocar nada aqui.
      - uses: actions/configure-pages@v5
        if: ${{ !github.event.repository.private }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: public

  desplegar:
    needs: construir
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
